<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur d'IMC — Akieni Academy</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="entete">
        <h1>Calculateur d'IMC</h1>
        <p class="sous-titre">Semaine 7 — Projet débutant</p>
    </header>
    <main>
        <section class="carte">
            <h2>Résultats</h2>
            <table class="tableau-imc">
                <thead>
                    <tr>
                        <th>Catégorie</th>
                        <th>Tranche d'IMC</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="maigreur">
                        <td>Insuffisance pondérale (Maigreur)</td>
                        <td>Moins de 18.5</td>
                    </tr>
                    <tr class="normal">
                        <td>Corpulance normale</td>
                        <td>18.5 à 24.9</td>
                    </tr>
                    <tr class="surpoids">
                        <td>Surpoids</td>
                        <td>25 à 29.9</td>
                    </tr>
                    <tr class="obesite">
                        <td>Obésité</td>
                        <td>30 et plus</td>
                    </tr>
                </tbody>
            </table>
            <div id="sortie"><!-- le JavaScript écrit ici --></div>
        </section>
    </main>
    <footer class="pied">
        <p>Akieni Academy — Cohorte 2 — 2026</p>
    </footer>
    <script src="main.js"></script>
</body>

</html>
